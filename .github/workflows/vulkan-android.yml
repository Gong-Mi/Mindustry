name: Vulkan Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17

    - name: Setup Android NDK
      uses: n0rt3n/setup-ndk@v1.2.0
      with:
        ndk-version: r25c

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build Android APK
      run: |
        chmod +x gradlew
        ./gradlew :android:assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Mindustry-Vulkan-Android
        path: android/build/outputs/apk/debug/android-debug.apk
