name: Vulkan Android Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager "ndk;25.2.9519653"

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Build Android APK
      run: |
        chmod +x gradlew
        ./gradlew :android:assembleDebug --stacktrace
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/25.2.9519653

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Mindustry-Vulkan-Android
        path: android/build/outputs/apk/debug/android-debug.apk