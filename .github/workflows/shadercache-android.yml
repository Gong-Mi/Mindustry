name: ShaderCache Android Build

on:
  push:
    branches: [ master, shader-cache-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # AGP 8.2.2's ConstraintHandler mutates constraints during resolution, which is a
    # hard error on Gradle 9.x (upstream never builds :android in CI so it never hits this).
    # Pin the wrapper invocation to Gradle 8.14.3 for the android build only.
    - name: Install Gradle 8.14.3
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.14.3"

    - name: Checkout local Arc (shader-binary-cache branch)
      uses: actions/checkout@v4
      with:
        repository: Gong-Mi/Arc
        ref: shader-binary-cache
        path: Arc

    - name: Pack Assets
      run: |
        chmod +x gradlew
        gradle :tools:pack --no-daemon

    # localArc layout: build.gradle picks up ../Arc automatically
    - name: Build Android APK
      run: |
        gradle :android:assembleDebug --stacktrace --no-daemon

    - name: Verify shader-cache classes landed in the APK
      run: |
        APK=android/build/outputs/apk/debug/android-debug.apk
        mkdir -p dexdump && cd dexdump
        unzip -o ../$APK "classes*.dex" >/dev/null
        strings classes*.dex | grep -m2 "ShaderBinaryCache" || echo "WARNING: shader cache classes not found in dex"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Mindustry-ShaderCache-Android
        path: android/build/outputs/apk/debug/android-debug.apk
