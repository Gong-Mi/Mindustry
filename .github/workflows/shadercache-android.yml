name: ShaderCache Android Build

on:
  push:
    branches: [ master, shader-cache-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # AGP 8.2.2's ConstraintHandler mutates constraints during resolution, which is a
    # hard error on Gradle 9.x (upstream never builds :android in CI so it never hits this).
    # Pin the wrapper invocation to Gradle 8.14.3 for the android build only.
    - name: Install Gradle 8.14.3
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.14.3"

    - name: Checkout local Arc (shader-binary-cache branch)
      uses: actions/checkout@v4
      with:
        repository: Gong-Mi/Arc
        ref: shader-binary-cache
        path: arc-tmp

    # build.gradle checks file(rootDir.parent/'Arc'); GITHUB_WORKSPACE is /home/runner/work/Mindustry/Mindustry
    # so Arc must live at /home/runner/work/Mindustry/Arc — exactly one level above the repo root.
    - name: Place Arc at workspace parent (localArc layout)
      run: |
        mv arc-tmp ../Arc
        ls ../Arc | head -5

    - name: Pack Assets
      run: |
        chmod +x gradlew
        gradle :tools:pack --no-daemon

    # localArc layout: build.gradle picks up ../Arc automatically
    - name: Build Android APK (Debug)
      run: |
        gradle :android:assembleDebug --stacktrace --no-daemon

    # Build release with debug signing to verify CPU difference
    - name: Build Android APK (Release)
      run: |
        # Generate debug keystore and point release signing at it
        KEYSTORE=$HOME/.android/debug.keystore
        if [ ! -f "$KEYSTORE" ]; then
          keytool -genkey -v -keystore $KEYSTORE -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi
        gradle :android:assembleRelease \
          -PRELEASE_STORE_FILE=$KEYSTORE \
          -PRELEASE_STORE_PASSWORD=android \
          -PRELEASE_KEY_ALIAS=androiddebugkey \
          -PRELEASE_KEY_PASSWORD=android \
          --stacktrace --no-daemon

    - name: Verify shader-cache classes landed in the APK
      run: |
        APK=android/build/outputs/apk/debug/android-debug.apk
        ls -la $APK
        mkdir -p dexdump && cd dexdump
        unzip -o ../$APK "classes*.dex" >/dev/null
        for d in classes*.dex; do echo "== $d =="; strings "$d" | grep -c "shader_cache" || true; done
        strings classes*.dex | grep -m3 "ShaderBinaryCache\|shader_cache" && echo "DEX-VERIFY: shader cache present" || { echo "DEX-VERIFY: NOT FOUND"; exit 1; }

    - name: Upload APK (Debug)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Mindustry-ShaderCache-Android-Debug
        path: android/build/outputs/apk/debug/android-debug.apk

    - name: Upload APK (Release)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Mindustry-ShaderCache-Android-Release
        path: android/build/outputs/apk/release/android-release.apk
